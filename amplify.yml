version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "=== Build Environment ==="
        - echo "PWD=$(pwd)"
        - ls -la
        # Detect directory and install dependencies (all in one block so cd persists)
        - |
          if [ -f "next.config.js" ]; then
            echo "✓ Already in Next.js app directory"
            npm ci
          elif [ -d "deal-library-frontend" ]; then
            echo "✓ Found deal-library-frontend, changing directory"
            cd deal-library-frontend
            npm ci
          else
            echo "✗ ERROR: Cannot find Next.js application!"
            exit 1
          fi
    build:
      commands:
        # Build and copy static files for standalone deployment (all in one block so cd persists)
        - |
          if [ -f "next.config.js" ]; then
            echo "Building from current directory"
            npm run build
            cp -r public .next/standalone/public
            cp -r .next/static .next/standalone/.next/static
          elif [ -d "deal-library-frontend" ]; then
            cd deal-library-frontend
            npm run build
            cp -r public .next/standalone/public
            cp -r .next/static .next/standalone/.next/static
          fi
  artifacts:
    # For standalone output, deploy the standalone folder
    baseDirectory: deal-library-frontend/.next/standalone
    files:
      - '**/*'
  cache:
    paths:
      - deal-library-frontend/node_modules/**/*
      - deal-library-frontend/.next/cache/**/*