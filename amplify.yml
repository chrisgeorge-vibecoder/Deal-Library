version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "=== Build Environment ==="
        - echo "PWD=$(pwd)"
        - ls -la
        - node -v
        - npm -v
        - |
          echo "Installing dependencies..."
          cd deal-library-amplify-app
          pwd
          npm ci
    build:
      commands:
        - |
          echo "=== Starting Build Phase ==="
          echo "Current directory: $(pwd)"
          ls -la
          
          # Navigate to app directory
          cd deal-library-amplify-app
          echo "Now in: $(pwd)"
          
          # Build the Next.js app
          echo "Building Next.js app..."
          npm run build
          
          # Create Amplify hosting structure for SSR deployment
          echo "Creating .amplify-hosting directory structure..."
          mkdir -p .amplify-hosting/compute/default
          mkdir -p .amplify-hosting/static/_next
          
          # Copy static assets
          if [ -d "public" ]; then
            cp -r public/* .amplify-hosting/static/ 2>/dev/null || true
            echo "✓ Public assets copied"
          fi
          
          # Copy Next.js static files
          if [ -d ".next/static" ]; then
            cp -r .next/static .amplify-hosting/static/_next/
            echo "✓ Next.js static files copied"
          fi
          
          # Copy the entire .next directory for SSR
          cp -r .next .amplify-hosting/compute/default/
          echo "✓ .next directory copied"
          
          # Copy node_modules needed for runtime
          cp -r node_modules .amplify-hosting/compute/default/
          echo "✓ node_modules copied"
          
          # Copy package.json for runtime
          cp package.json .amplify-hosting/compute/default/
          echo "✓ package.json copied"
          
          # Create the server entry point
          cat > .amplify-hosting/compute/default/server.js << 'SERVEREOF'
const { createServer } = require('http');
const { parse } = require('url');
const next = require('next');

const dev = false;
const hostname = '0.0.0.0';
const port = parseInt(process.env.PORT, 10) || 3000;

const app = next({ dev, hostname, port, dir: __dirname });
const handle = app.getRequestHandler();

app.prepare().then(() => {
  createServer(async (req, res) => {
    try {
      const parsedUrl = parse(req.url, true);
      await handle(req, res, parsedUrl);
    } catch (err) {
      console.error('Error occurred handling', req.url, err);
      res.statusCode = 500;
      res.end('internal server error');
    }
  }).listen(port, (err) => {
    if (err) throw err;
    console.log(`> Ready on http://${hostname}:${port}`);
  });
});
SERVEREOF
          echo "✓ server.js created"
          
          # Create deploy manifest for Amplify
          cat > .amplify-hosting/deploy-manifest.json << 'MANIFESTEOF'
{
  "version": 1,
  "routes": [
    {
      "path": "/_next/static/*",
      "target": {
        "kind": "Static"
      }
    },
    {
      "path": "/favicon.ico",
      "target": {
        "kind": "Static"
      }
    },
    {
      "path": "/*",
      "target": {
        "kind": "Compute",
        "src": "default"
      }
    }
  ],
  "computeResources": [
    {
      "name": "default",
      "entrypoint": "server.js",
      "runtime": "nodejs18.x"
    }
  ],
  "framework": {
    "name": "next",
    "version": "14.2.7"
  }
}
MANIFESTEOF
          echo "✓ deploy-manifest.json created"
          
          echo "=== .amplify-hosting structure ==="
          ls -la .amplify-hosting/
          ls -la .amplify-hosting/compute/default/ | head -10
          echo "✅ Build complete!"
  artifacts:
    baseDirectory: deal-library-amplify-app/.amplify-hosting
    files:
      - '**/*'
  cache:
    paths:
      - deal-library-amplify-app/node_modules/**/*
      - deal-library-amplify-app/.next/cache/**/*
