version: 1
applications:
  - appRoot: deal-library-amplify-app
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - echo "=== Building Next.js ==="
            - echo "=== Environment variables check (build time) ==="
            - |
              if [ -n "$GOOGLE_APPS_SCRIPT_URL" ]; then
                echo "GOOGLE_APPS_SCRIPT_URL is SET (length: ${#GOOGLE_APPS_SCRIPT_URL})"
              else
                echo "GOOGLE_APPS_SCRIPT_URL is NOT SET"
              fi
            - |
              if [ -n "$RESEND_API_KEY" ]; then
                echo "RESEND_API_KEY is SET"
              else
                echo "RESEND_API_KEY is NOT SET"
              fi
            - |
              if [ -n "$GEMINI_API_KEY" ]; then
                echo "GEMINI_API_KEY is SET"
              else
                echo "GEMINI_API_KEY is NOT SET"
              fi
            # Create .env.local with runtime environment variables
            - echo "=== Creating .env.local for runtime ==="
            - |
              echo "GOOGLE_APPS_SCRIPT_URL=$GOOGLE_APPS_SCRIPT_URL" > .env.local
              echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> .env.local
              echo "RESEND_API_KEY=$RESEND_API_KEY" >> .env.local
              echo "SUPABASE_URL=$SUPABASE_URL" >> .env.local
              echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> .env.local
              echo "USE_SUPABASE=$USE_SUPABASE" >> .env.local
            - echo "=== .env.local created with variables ==="
            - cat .env.local | sed 's/=.*/=***/'
            - npm run build
            - echo "=== Build complete, checking output ==="
            - ls -la .next/
            - ls -la .next/standalone/ || echo "No standalone folder"
            - echo "=== Creating Amplify hosting structure ==="
            # Create directory structure
            - mkdir -p .amplify-hosting/compute/default/.next
            - mkdir -p .amplify-hosting/static/_next/static
            # Copy standalone server
            - cp -r .next/standalone/. .amplify-hosting/compute/default/
            # Copy .env.local to standalone output so it's available at runtime
            - cp .env.local .amplify-hosting/compute/default/.env.local 2>/dev/null || echo "No .env.local to copy"
            # Copy static assets to both locations
            - cp -r .next/static/. .amplify-hosting/static/_next/static/
            - cp -r .next/static .amplify-hosting/compute/default/.next/
            # Copy public folder
            - cp -r public/. .amplify-hosting/static/ 2>/dev/null || true
            - cp -r public .amplify-hosting/compute/default/ 2>/dev/null || true
            # Create deploy manifest
            - |
              cat > .amplify-hosting/deploy-manifest.json << 'MANIFEST'
              {
                "version": 1,
                "routes": [
                  {
                    "path": "/_next/static/*",
                    "target": {
                      "kind": "Static"
                    }
                  },
                  {
                    "path": "/*.*",
                    "target": {
                      "kind": "Static"
                    },
                    "fallback": {
                      "kind": "Compute",
                      "src": "default"
                    }
                  },
                  {
                    "path": "/*",
                    "target": {
                      "kind": "Compute",
                      "src": "default"
                    }
                  }
                ],
                "computeResources": [
                  {
                    "name": "default",
                    "entrypoint": "server.js",
                    "runtime": "nodejs20.x"
                  }
                ],
                "framework": {
                  "name": "next",
                  "version": "14.2.7"
                }
              }
              MANIFEST
            - echo "=== Final structure ==="
            - ls -la .amplify-hosting/
            - ls -la .amplify-hosting/compute/default/
            - echo "=== Deploy manifest ==="
            - cat .amplify-hosting/deploy-manifest.json
      artifacts:
        baseDirectory: .amplify-hosting
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
