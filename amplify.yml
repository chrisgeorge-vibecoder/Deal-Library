version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "=== Build Environment ==="
        - echo "PWD=$(pwd)"
        - echo "Contents:"
        - ls -la
        # Always cd into deal-library-frontend for consistent paths
        - cd deal-library-frontend
        - echo "Installing dependencies in deal-library-frontend..."
        - npm ci
    build:
      commands:
        - cd deal-library-frontend
        - echo "Building Next.js application..."
        - npm run build
        - echo "Build complete. Checking .next directory..."
        - ls -la .next
  artifacts:
    # Path relative to repo root - must include the subdirectory
    baseDirectory: deal-library-frontend/.next
    files:
      - '**/*'
  cache:
    paths:
      - deal-library-frontend/node_modules/**/*
      - deal-library-frontend/.next/cache/**/*
