version: 1
# NOTE: This config assumes App root is set to "deal-library-frontend" in Amplify Console
# Go to: App settings > General > Edit > Set "App root" to "deal-library-frontend"
frontend:
  phases:
    preBuild:
      commands:
        - echo "=== Build Environment ==="
        - echo "Current directory:" && pwd
        - echo "Contents:" && ls -la
        - npm ci
    build:
      commands:
        - echo "Building Next.js app..."
        - npm run build
        - echo "Build complete. Contents of .next:"
        - ls -la .next
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
