version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "Node version:"
        - node --version
        - echo "NPM version:"
        - npm --version
        - echo "Current directory:"
        - pwd
        - echo "Installing dependencies..."
        - cd deal-library-frontend && npm ci
    build:
      commands:
        - echo "Building application..."
        - cd deal-library-frontend && npm run build
  artifacts:
    baseDirectory: deal-library-frontend/.next
    files:
      - '**/*'
  cache:
    paths:
      - deal-library-frontend/node_modules/**/*
      - deal-library-frontend/.next/cache/**/*
