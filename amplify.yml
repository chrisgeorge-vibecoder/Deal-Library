version: 1
# App root is set to "deal-library-frontend" in Amplify Console
frontend:
  phases:
    preBuild:
      commands:
        - echo "=== Build Environment ==="
        - echo "Current directory:" && pwd
        - echo "Files:" && ls -la
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
