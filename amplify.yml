version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "=== Build Environment ==="
        - echo "PWD=$(pwd)"
        - echo "Contents:"
        - ls -la
        # Detect if we're already in deal-library-frontend or need to cd into it
        - |
          if [ -f "next.config.js" ]; then
            echo "✓ Already in Next.js app directory (deal-library-frontend)"
            APP_DIR="."
          elif [ -d "deal-library-frontend" ]; then
            echo "✓ Found deal-library-frontend, changing directory"
            cd deal-library-frontend
            APP_DIR="deal-library-frontend"
          else
            echo "✗ ERROR: Cannot find Next.js application!"
            echo "Expected either:"
            echo "  - next.config.js in current directory, or"
            echo "  - deal-library-frontend subdirectory"
            exit 1
          fi
        - echo "Installing dependencies..."
        - npm ci
    build:
      commands:
        # Same detection logic for build phase (cd doesn't persist across phases)
        - |
          if [ -f "next.config.js" ]; then
            echo "Building from current directory"
          elif [ -d "deal-library-frontend" ]; then
            cd deal-library-frontend
          fi
        - npm run build
  artifacts:
    # Path relative to repo root since build runs in deal-library-frontend
    baseDirectory: deal-library-frontend/.next
    files:
      - '**/*'
  cache:
    paths:
      - deal-library-frontend/node_modules/**/*
      - deal-library-frontend/.next/cache/**/*