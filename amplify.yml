version: 1
frontend:
  phases:
    preBuild:
      commands:
        - 'echo "Current directory:" && pwd'
        - 'echo "Listing files:" && ls -la'
        - 'echo "Changing to frontend directory..." && cd deal-library-frontend'
        - 'echo "In frontend directory:" && pwd'
        - cd deal-library-frontend && npm ci
    build:
      commands:
        - 'echo "Current directory:" && pwd'
        - 'echo "Listing files:" && ls -la'
        - 'echo "Changing to frontend directory..." && cd deal-library-frontend'
        - 'echo "In frontend directory:" && pwd'
        - cd deal-library-frontend && npm run build
  artifacts:
    baseDirectory: deal-library-frontend/.next
    files:
      - '**/*'
  cache:
    paths:
      - deal-library-frontend/node_modules/**/*
      - deal-library-frontend/.next/cache/**/*

