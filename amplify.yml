version: 1
applications:
  - appRoot: deal-library-amplify-app
    frontend:
      phases:
        preBuild:
          commands:
            - echo "=== Build Environment ==="
            - echo "Root workspace: $AMPLIFY_MONOREPO_APP_ROOT"
            - echo "PWD=$(pwd)"
            - node -v
            - npm -v
            - npm ci
        build:
          commands:
            - echo "Building Next.js app in $(pwd)"
            - npm run build
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
