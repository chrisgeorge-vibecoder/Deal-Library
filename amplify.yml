version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "=== Build Environment ==="
        - echo "PWD=$(pwd)"
    build:
      commands:
        - npm run build
            cd deal-library-amplify-app
            npm run build
            cp -r public .next/standalone/public
            cp -r .next/static .next/standalone/.next/static
          fi
  artifacts:
    baseDirectory: .next
    baseDirectory: deal-library-amplify-app/.next/standalone
    files:
      - '**/*'
  cache:
    paths:
      - deal-library-amplify-app/node_modules/**/*
      - deal-library-amplify-app/.next/cache/**/*
